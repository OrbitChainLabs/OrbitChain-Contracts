# Pull-request triage (issue #127).
#
# Runs `actions/labeler@v5` with the configuration in
# `.github/labeler.yml`. Each PR gets `api`, `cli`, `frontend`, `ci`,
# `documentation`, `storage`, `testing`, or `security` applied based on
# which file globs the PR touches.
#
# `pull_request_target` is the official recipe for labeler workflows
# because the action needs `pull-requests: write` to apply labels, and
# that permission is only available in the base branch's context.
#
# We explicitly check out the PR head so the labeler reads the
# `.github/labeler.yml` from the PR branch rather than fetching the
# base-branch copy via the API.  This lets PRs ship their own labeler
# config fixes without a chicken-and-egg problem.  The only action
# that consumes the checkout is `actions/labeler` (read-only YAML),
# so the pull_request_target context remains safe.

name: Pull Request Labeler

permissions:
  contents: read
  pull-requests: write

on:
  - pull_request_target

jobs:
  labeler:
    name: Apply file-glob → label mapping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply labels
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
